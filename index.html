    function quickFill(u, p) {
      document.getElementById('loginUser').value = u;
      document.getElementById('loginPass').value = p;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('loginUser').value.trim().toLowerCase();
      const p = document.getElementById('loginPass').value.trim();

      // Si hay URL de Google Apps Script configurada, valida contra Google Sheets primero
      if (GOOGLE_SCRIPT_URL) {
        try {
          const res = await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'login', payload: { usuario: u, clave: p } })
          });
          const json = await res.json();
          if (json.ok) {
            iniciarSesionConUsuario({
              nombre: json.user.NOMBRE,
              usuario: json.user.USUARIO,
              rol: json.user.ROL,
              caja: json.user.CAJA_ASIGNADA
            });
            return;
          }
        } catch (err) {
          console.warn('Usando modo local de respaldo:', err);
        }
      }

      const found = state.users.find(x => x.usuario.toLowerCase() === u && x.clave === p && x.estado === 'ACTIVO');
      if (!found) {
        alert('Credenciales incorrectas o usuario inactivo.');
        return;
      }
      iniciarSesionConUsuario(found);
    }
